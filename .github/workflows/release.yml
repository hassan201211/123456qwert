name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'true'

      - name: Build and Package
        run: |
          # 1. إعطاء رقم إصدار عشوائي/تلقائي
          agvtool new-version -all $(git rev-parse HEAD)

          # 2. بناء التطبيق داخل مجلد _build الافتراضي
          xcodebuild clean build \
            -project Feather.xcodeproj \
            -scheme Feather \
            -configuration Release \
            -destination "generic/platform=iOS" \
            EXCLUDED_ARCHS="x86_64" \
            CODE_SIGNING_ALLOWED=NO \
            ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES=NO \
            SYMROOT="${PWD}/_build"

          # 3. تجهيز مجلد التثبيت Payload
          mkdir -p Payload
          
          # نسخ ملف .app من مسار المخرجات الحقيقي
          cp -R _build/Release-iphoneos/*.app Payload/

          # 4. ضغط الحزمة باسم Room.ipa
          mkdir -p packages
          zip -r packages/Room.ipa Payload

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Room ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: packages/Room.ipa
          generate_release_notes: true
          fail_on_unmatched_files: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
