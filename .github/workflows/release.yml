name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: 'true'

      - name: Prepare dependencies (Xcode)
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.0.app

      - name: Build
        run: | 
          agvtool new-version -all $(git rev-parse HEAD)
          
          # 1. تنظيف كاش الحزم
          find . -name "Package.resolved" -delete
          rm -rf ~/Library/Caches/org.swift.swiftpm
          rm -rf .build
          
          # 2. ترتيب وإعادة جلب الحزم
          xcodebuild -project Feather.xcodeproj -scheme Feather -resolvePackageDependencies
          
          # 3. البناء الصريح باستخدام xcodebuild وتحديد مسار المخرجات
          xcodebuild clean build \
            -project Feather.xcodeproj \
            -scheme Feather \
            -configuration Release \
            -destination "generic/platform=iOS" \
            EXCLUDED_ARCHS="x86_64" \
            CODE_SIGNING_ALLOWED=NO \
            ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES=NO \
            CONFIGURATION_BUILD_DIR=${PWD}/build_output
            
          # 4. التغليف اليدوي للتطبيق (لحل مشكلة خطوة الإصدار)
          mkdir -p _build/Payload
          cp -r build_output/*.app _build/Payload/
          
          # 5. تجهيز ملف التطبيق النهائي
          mkdir -p packages
          cd _build
          zip -r ../packages/Feather.ipa Payload

      - name: Get Version
        id: get_version
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" _build/Payload/*.app/Info.plist)
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Create Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v3.0.2
        with:
          name: Feather v${{ env.VERSION }}
          tag_name: v${{ env.VERSION }}
          files: |
            packages/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          draft: true
        env:
          GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}
