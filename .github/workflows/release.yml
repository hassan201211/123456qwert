name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'true'

      - name: Prepare dependencies (Xcode)
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Build
        run: | 
          agvtool new-version -all $(git rev-parse HEAD)
          
          # 1. تنظيف كاش الحزم
          find . -name "Package.resolved" -delete
          rm -rf ~/Library/Caches/org.swift.swiftpm
          rm -rf .build
          
          # 2. ترتيب وإعادة جلب الحزم
          xcodebuild -project Feather.xcodeproj -scheme Feather -resolvePackageDependencies
          
          # 3. البناء وتحديد مسار المخرجات
          xcodebuild clean build \
            -project Feather.xcodeproj \
            -scheme Feather \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -ARCHS="arm64" \
            -CODE_SIGNING_ALLOWED=NO \
            -ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES=NO \
            -CONFIGURATION_BUILD_DIR=${PWD}/build_output
            
          # 4. إنشاء مجلد التغليف ونسخ التطبيق
          mkdir -p _build/Payload
          cp -r build_output/*.app _build/Payload/
          
          # 5. ضغط وتوليد Room.ipa داخل مجلد packages
          mkdir -p packages
          cd _build
          zip -r ../packages/Room.ipa Payload

      - name: Get Version
        id: get_version
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" _build/Payload/*.app/Info.plist)
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Room ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: packages/Room.ipa
          generate_release_notes: true
          fail_on_unmatched_files: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
