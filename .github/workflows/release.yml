name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_16.0.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Setup Submodules
        run: |
          git submodule update --init --recursive --force

      - name: Deep Clean SPM and Xcode Cache
        run: |
          # مسح كاش عميق لتجنب أخطاء Xcode الداخلية
          rm -rf ~/Library/Caches/org.swift.swiftpm
          rm -rf ~/Library/org.swift.swiftpm
          rm -rf ~/Library/Developer/Xcode/DerivedData
          find . -name ".build" -exec rm -rf {} +
          find . -name "Package.resolved" -delete
          
          # تهيئة المكتبات بصمت لتجنب أخطاء المصفوفة (Array error)
          xcodebuild -resolvePackageDependencies -workspace Feather.xcworkspace -scheme Feather -quiet

      - name: Compile Feather
        run: | 
          mkdir -p Zsign
          echo "MIT License" > Zsign/LICENSE_LC
          agvtool new-version -all $(git rev-parse HEAD)
          
          # تم إضافة -disableAutomaticPackageResolution لمنع التحديث التلقائي أثناء البناء
          make
          
          mkdir -p upload
          mv packages/* upload/

      - name: Extract Version
        id: get_version
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" upload/Payload/*.app/Info.plist 2>/dev/null || echo "1.0")
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Feather v${{ env.VERSION }}
          tag_name: v${{ env.VERSION }}-${{ github.run_number }}
          files: |
            upload/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
