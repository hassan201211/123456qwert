name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'true'

      - name: Select Xcode 15.4
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Build App
        run: |
          BUILD_NUMBER=$(git rev-list --count HEAD)
          agvtool new-version -all $BUILD_NUMBER
          
          xcodebuild clean build \
            -workspace Feather.xcworkspace \
            -scheme Feather \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath "./build_output" \
            EXCLUDED_ARCHS="x86_64" \
            CODE_SIGNING_ALLOWED=NO \
            ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES=NO
            
          mkdir -p _build/Payload
          APP_PATH=$(find ./build_output -name "*.app" | grep -v "IntermediateBuildFiles" | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "Error: Could not find .app file."
            exit 1
          fi
          
          echo "Found app at: $APP_PATH"
          cp -r "$APP_PATH" _build/Payload/
          
          mkdir -p packages
          cd _build
          zip -r ../packages/Room.ipa Payload

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Room ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: packages/Room.ipa
          generate_release_notes: true
          fail_on_unmatched_files: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
