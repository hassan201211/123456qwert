name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_16.0.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Setup Submodules
        run: |
          git submodule update --init --recursive --force

      - name: Deep Clean SPM and Xcode Cache
        run: |
          rm -rf ~/Library/Caches/org.swift.swiftpm
          rm -rf ~/Library/org.swift.swiftpm
          rm -rf ~/Library/Developer/Xcode/DerivedData
          find . -name ".build" -exec rm -rf {} +
          find . -name "Package.resolved" -delete
          
          # تهيئة المكتبات بصمت
          xcodebuild -resolvePackageDependencies -workspace Feather.xcworkspace -scheme Feather -quiet

      - name: Build App (iOS Only)
        run: | 
          agvtool new-version -all $(git rev-parse HEAD)
          
          # البناء للآيفون حصراً لتجنب أخطاء Mac Catalyst
          xcodebuild clean build \
            -workspace Feather.xcworkspace \
            -scheme Feather \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath "./build_output" \
            EXCLUDED_ARCHS="x86_64" \
            CODE_SIGNING_ALLOWED=NO \
            ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES=NO
            
          # تجهيز ملف IPA
          mkdir -p packages
          mkdir -p _build/Payload
          
          APP_PATH=$(find ./build_output -name "*.app" | grep -v "IntermediateBuildFiles" | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "Error: Could not find .app file."
            exit 1
          fi
          
          cp -r "$APP_PATH" _build/Payload/
          cd _build
          zip -r ../packages/Room.ipa Payload

      - name: Extract Version
        id: get_version
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" _build/Payload/*.app/Info.plist 2>/dev/null || echo "1.0")
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Feather v${{ env.VERSION }}
          tag_name: v${{ env.VERSION }}-${{ github.run_number }}
          files: packages/Room.ipa
          generate_release_notes: true
          fail_on_unmatched_files: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
