name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'true'

      - name: Prepare dependencies (Xcode)
        run: |
          sudo xcode-select -s /Applications/Xcode_16.0.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Force Clean SPM Cache
        run: |
          # مسح ملفات الكاش القديمة التي تسبب تعارضات Array Index في Xcode 16+
          find . -name "Package.resolved" -delete
          rm -rf ~/Library/Caches/org.swift.swiftpm
          rm -rf .build
          rm -rf ~/Library/Developer/Xcode/DerivedData

      - name: Build
        run: | 
          agvtool new-version -all $(git rev-parse HEAD)
          
          # البناء مع تحديد مسار مخرجات مستقل وتخطي الجلب المسبق المعيب
          xcodebuild clean build \
            -project Feather.xcodeproj \
            -scheme Feather \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -resolvePackageDependencies \
            EXCLUDED_ARCHS="x86_64" \
            CODE_SIGNING_ALLOWED=NO \
            ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES=NO \
            -derivedDataPath ./build_output
            
          # البحث عن التطبيق المبني ونسخه لتجهيزه للضغط
          mkdir -p _build/Payload
          APP_PATH=$(find ./build_output/Build/Products -name "*.app" | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "Error: Could not find .app file in build_output."
            exit 1
          fi
          
          cp -r "$APP_PATH" _build/Payload/
          
          # ضغط التطبيق باسم Room.ipa
          mkdir -p packages
          cd _build
          zip -r ../packages/Room.ipa Payload

      - name: Get Version
        id: get_version
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" _build/Payload/*.app/Info.plist)
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Room ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: packages/Room.ipa
          generate_release_notes: true
          fail_on_unmatched_files: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
